---
name: Check
on: push
jobs:
    eval:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
            - name: Install nix
              uses: cachix/install-nix-action@v31
            - name: Check formatting
              run: nix fmt -- --check $(git ls-files '*.nix')
            - name: Evaluate home-manager configurations
              run: |
                  for host in alex-fw alex-nuc; do
                    nix eval ".#homeConfigurations.$host.activationPackage.drvPath"
                  done
            - name: Evaluate darwin configuration
              run: nix eval '.#darwinConfigurations."Alexs-MacBook-Pro".system.drvPath'

    pre-commit:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
            - name: Pre Commit
              uses: pre-commit/action@v3.0.1
              # nixfmt runs via `nix fmt`, which isn't available here; the eval
              # job checks formatting instead.
              env:
                  SKIP: nixfmt
              with:
                  extra_args: --verbose --all-files
