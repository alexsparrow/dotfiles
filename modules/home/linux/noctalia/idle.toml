# Lock at 5 min, screens off at 10 min. Once already locked (e.g. Mod+Ctrl+Q),
# screens go off after 1 min instead. The table name is only a label - `action`
# is what makes a behavior do anything.
[idle]
pre_action_fade_seconds = 5.0

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 300.0

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 600.0
locked_timeout = 60.0
