---
repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: check-toml
          - id: check-yaml
    - repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
      rev: 0.2.3
      hooks:
          - id: yamlfmt

    - repo: https://github.com/koalaman/shellcheck-precommit
      rev: v0.11.0
      hooks:
          - id: shellcheck
            args: [-e, SC1071]

    # Formatting .nix files is done by `nix fmt` (nixfmt, see flake.nix), which
    # needs nix available - hence a local hook rather than a pinned repo.
    - repo: local
      hooks:
          - id: nixfmt
            name: nixfmt
            entry: nix fmt --
            language: system
            files: \.nix$
